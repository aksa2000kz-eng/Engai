<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>EngUp — Разговорный английский без воды</title>
<style>
/* ============================================================
   EngUp — автономное приложение для изучения разговорного
   американского английского. Один файл, без интернета.
   ============================================================ */

:root{
  /* --- Светлая тема: тёплая, живая, зелёно-янтарная --- */
  --bg:            #F6F3EA;
  --bg-elevated:   #FFFFFF;
  --bg-sunken:     #EDE7D8;
  --ink:           #1F2A22;
  --ink-soft:      #5A6459;
  --ink-faint:     #8B9186;
  --line:          #DDD5C0;

  --green-900:     #163326;
  --green-700:     #1F5B3F;
  --green-600:     #2C7A52;
  --green-500:     #3C9468;
  --green-100:     #DCEEE0;

  --amber-600:     #D98A2B;
  --amber-500:     #E8A33D;
  --amber-100:     #FBEAD0;

  --coral-500:     #D9634C;
  --coral-100:     #F8E0D9;

  --shadow-sm: 0 1px 2px rgba(22,51,38,.08);
  --shadow-md: 0 6px 20px rgba(22,51,38,.10);
  --shadow-lg: 0 16px 40px rgba(22,51,38,.16);

  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 24px;

  --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

  --font-scale: 1;
  --ease: cubic-bezier(.22,1,.36,1);
}

[data-theme="dark"]{
  --bg:            #10160F;
  --bg-elevated:   #1A2119;
  --bg-sunken:     #0A0E0A;
  --ink:           #EDE9DC;
  --ink-soft:      #ADB5A6;
  --ink-faint:     #6E766A;
  --line:          #2A322A;

  --green-900:     #DCEEE0;
  --green-700:     #7FD3A5;
  --green-600:     #5CBF89;
  --green-500:     #4AAE79;
  --green-100:     #1C3327;

  --amber-600:     #F2B255;
  --amber-500:     #E8A33D;
  --amber-100:     #3A2E14;

  --coral-500:     #E68268;
  --coral-100:     #3A2019;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 20px 48px rgba(0,0,0,.5);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:calc(16px * var(--font-scale));
  line-height:1.5;
  transition:background .3s var(--ease), color .3s var(--ease);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; margin:0; color:var(--ink); }
p{ margin:0; }
button{ font-family:inherit; }
::selection{ background:var(--amber-100); }
:focus-visible{ outline:2px solid var(--green-600); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ---------- layout shell ---------- */
.app{ min-height:100vh; display:flex; }

.sidebar{
  width:264px; flex-shrink:0; background:var(--bg-elevated);
  border-right:1px solid var(--line); padding:20px 14px;
  display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{
  display:flex; align-items:center; gap:10px; padding:6px 10px 22px 10px;
}
.brand-mark{
  width:38px; height:38px; border-radius:11px;
  background:linear-gradient(135deg,var(--green-600),var(--amber-500));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; color:#fff; font-size:19px;
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
}
.brand-text h1{ font-size:19px; letter-spacing:-.01em; }
.brand-text span{ font-size:11px; color:var(--ink-faint); letter-spacing:.03em; text-transform:uppercase; }

.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:var(--radius-s);
  color:var(--ink-soft); cursor:pointer; border:none; background:none;
  font-size:14.5px; text-align:left; width:100%;
  transition:background .18s var(--ease), color .18s var(--ease);
  position:relative;
}
.nav-item:hover{ background:var(--bg-sunken); color:var(--ink); }
.nav-item.active{ background:var(--green-100); color:var(--green-700); font-weight:600; }
.nav-item .ic{ width:20px; text-align:center; font-size:16px; flex-shrink:0; }
.nav-item .nav-badge{
  margin-left:auto; font-size:10.5px; background:var(--amber-500); color:#3A2607;
  padding:1px 7px; border-radius:99px; font-weight:700;
}

.sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.streak-pill{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--amber-100); border-radius:var(--radius-s); font-size:13px; color:var(--ink);
}
.streak-pill b{ font-family:var(--font-display); font-size:16px; }

.main{ flex:1; min-width:0; }
.topbar{
  display:none; align-items:center; justify-content:space-between;
  padding:14px 16px; background:var(--bg-elevated); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
}
.topbar .brand{ padding:0; }
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elevated);
  color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .15s var(--ease), transform .1s var(--ease);
}
.icon-btn:hover{ background:var(--bg-sunken); }
.icon-btn:active{ transform:scale(.94); }

.view{ padding:32px 40px 90px; max-width:1120px; margin:0 auto; animation:fadein .35s var(--ease); }
@keyframes fadein{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

.view-head{ margin-bottom:26px; }
.eyebrow{ font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--green-600); font-weight:700; margin-bottom:6px; }
.view-head h2{ font-size:30px; letter-spacing:-.015em; }
.view-head p{ color:var(--ink-soft); margin-top:6px; font-size:14.5px; max-width:60ch; }

/* ---------- cards / grid ---------- */
.card{
  background:var(--bg-elevated); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:20px; box-shadow:var(--shadow-sm);
}
.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:900px){ .grid-4{ grid-template-columns:repeat(2,1fr);} .grid-3{ grid-template-columns:repeat(2,1fr);} }

.stat-card{ display:flex; flex-direction:column; gap:6px; }
.stat-card .ic{
  width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:17px; margin-bottom:6px;
}
.stat-card .num{ font-family:var(--font-display); font-size:28px; letter-spacing:-.02em; }
.stat-card .label{ font-size:12.5px; color:var(--ink-soft); }

.progress-track{ height:8px; border-radius:99px; background:var(--bg-sunken); overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg,var(--green-600),var(--amber-500)); transition:width .5s var(--ease); }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 18px; border-radius:99px; font-size:14px; font-weight:600; cursor:pointer;
  border:1px solid transparent; transition:transform .12s var(--ease), box-shadow .2s var(--ease), background .18s var(--ease), border-color .18s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--green-600); color:#fff; box-shadow:var(--shadow-sm); }
.btn-primary:hover{ background:var(--green-700); box-shadow:var(--shadow-md); }
.btn-amber{ background:var(--amber-500); color:#3A2607; }
.btn-amber:hover{ background:var(--amber-600); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ background:var(--bg-sunken); }
.btn-danger{ background:transparent; border-color:var(--coral-500); color:var(--coral-500); }
.btn-danger:hover{ background:var(--coral-100); }
.btn-sm{ padding:7px 13px; font-size:13px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-block{ width:100%; }

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:99px;
  border:1px solid var(--line); background:var(--bg-elevated); color:var(--ink-soft);
  font-size:13px; cursor:pointer; transition:all .15s var(--ease); user-select:none;
}
.chip:hover{ border-color:var(--green-500); color:var(--ink); }
.chip.active{ background:var(--green-600); border-color:var(--green-600); color:#fff; font-weight:600; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }

input[type=text],input[type=search],select{
  font-family:inherit; font-size:14px; padding:10px 14px; border-radius:var(--radius-s);
  border:1px solid var(--line); background:var(--bg-elevated); color:var(--ink); width:100%;
}
input[type=text]:focus,input[type=search]:focus{ border-color:var(--green-600); }

/* ---------- word list ---------- */
.word-row{
  display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--radius-s);
  border:1px solid var(--line); background:var(--bg-elevated); margin-bottom:9px;
  transition:border-color .15s var(--ease), transform .12s var(--ease);
}
.word-row:hover{ border-color:var(--green-500); }
.word-main{ flex:1; min-width:0; }
.word-en{ font-family:var(--font-display); font-size:17px; font-weight:700; }
.word-trans{ color:var(--green-600); font-size:12.5px; font-family:var(--font-mono); margin-left:8px; }
.word-ru{ color:var(--ink-soft); font-size:13.5px; margin-top:2px; }
.word-ex{ font-size:12.5px; color:var(--ink-faint); margin-top:5px; font-style:italic; }
.word-actions{ display:flex; gap:6px; flex-shrink:0; }
.icon-mini{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:none;
  color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px;
  transition:all .15s var(--ease);
}
.icon-mini:hover{ background:var(--bg-sunken); }
.icon-mini.on{ background:var(--amber-100); border-color:var(--amber-500); color:var(--amber-600); }
.icon-mini.learned{ background:var(--green-100); border-color:var(--green-500); color:var(--green-700); }
.badge-level{
  font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:99px;
  background:var(--bg-sunken); color:var(--ink-soft); font-weight:700; flex-shrink:0;
}

/* ---------- flashcard ---------- */
.flash-wrap{ display:flex; flex-direction:column; align-items:center; gap:22px; }
.flash-scene{ width:100%; max-width:460px; height:280px; perspective:1400px; }
.flash-card{
  width:100%; height:100%; position:relative; transform-style:preserve-3d;
  transition:transform .5s var(--ease); cursor:pointer;
}
.flash-card.flipped{ transform:rotateY(180deg); }
.flash-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-l);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;
  padding:30px; box-shadow:var(--shadow-lg); border:1px solid var(--line);
}
.flash-front{ background:var(--bg-elevated); }
.flash-back{ background:var(--green-700); color:#fff; transform:rotateY(180deg); border:none; }
.flash-face .en{ font-family:var(--font-display); font-size:30px; font-weight:700; }
.flash-face .tr{ font-family:var(--font-mono); color:var(--green-600); font-size:14px; }
.flash-back .tr{ color:var(--amber-100); }
.flash-face .ru{ font-size:18px; }
.flash-face .ex{ font-size:13px; opacity:.85; margin-top:8px; max-width:34ch; }
.flash-hint{ font-size:12px; color:var(--ink-faint); }
.flash-controls{ display:flex; gap:10px; }

/* ---------- tests ---------- */
.test-progress{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.test-progress .progress-track{ flex:1; }
.test-progress span{ font-size:13px; color:var(--ink-soft); white-space:nowrap; }
.test-q{ text-align:center; padding:10px 0 26px; }
.test-q .prompt-label{ font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
.test-q .prompt{ font-family:var(--font-display); font-size:28px; font-weight:700; }
.test-q .prompt .tr{ font-family:var(--font-mono); font-size:14px; color:var(--green-600); display:block; margin-top:6px; }
.opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:560px; margin:0 auto; }
@media (max-width:600px){ .opt-grid{ grid-template-columns:1fr; } }
.opt-btn{
  padding:15px 16px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--bg-elevated);
  cursor:pointer; font-size:15px; text-align:left; transition:all .15s var(--ease); color:var(--ink);
}
.opt-btn:hover{ border-color:var(--green-500); }
.opt-btn.correct{ border-color:var(--green-600); background:var(--green-100); color:var(--green-700); font-weight:700; }
.opt-btn.wrong{ border-color:var(--coral-500); background:var(--coral-100); color:var(--coral-500); font-weight:700; }
.opt-btn:disabled{ cursor:default; }
.input-answer{ max-width:340px; margin:0 auto; text-align:center; font-size:18px; padding:14px; }
.result-hero{ text-align:center; padding:40px 20px; }
.result-hero .num{ font-family:var(--font-display); font-size:64px; }

/* ---------- grammar ---------- */
.gram-list{ display:flex; flex-direction:column; gap:10px; }
.gram-item{
  border:1px solid var(--line); border-radius:var(--radius-m); background:var(--bg-elevated); overflow:hidden;
}
.gram-item summary{
  padding:16px 18px; cursor:pointer; font-family:var(--font-display); font-weight:700; font-size:16px;
  display:flex; justify-content:space-between; align-items:center; list-style:none;
}
.gram-item summary::-webkit-details-marker{ display:none; }
.gram-item summary::after{ content:'+'; font-size:20px; color:var(--ink-faint); transition:transform .2s var(--ease); }
.gram-item[open] summary::after{ transform:rotate(45deg); }
.gram-body{ padding:0 18px 20px; color:var(--ink-soft); font-size:14.5px; }
.gram-body h5{ color:var(--ink); font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin:14px 0 8px; }
.gram-body .example-line{ background:var(--bg-sunken); border-radius:8px; padding:8px 12px; margin-bottom:6px; font-family:var(--font-mono); font-size:13px; }
.gram-ex-btn{ margin-top:14px; }

/* ---------- speaking / dialogues ---------- */
.dialogue{ background:var(--bg-elevated); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px; margin-bottom:14px; }
.dialogue h4{ font-size:16px; margin-bottom:12px; }
.dline{ display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; }
.dline .who{
  width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff;
}
.dline .who.a{ background:var(--green-600); }
.dline .who.b{ background:var(--amber-500); color:#3A2607; }
.dline .txt{ padding-top:3px; }
.dline .en{ font-size:14.5px; }
.dline .ru{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }

.phrase-card{ background:var(--bg-elevated); border:1px solid var(--line); border-radius:var(--radius-s); padding:14px 16px; margin-bottom:8px; display:flex; gap:12px; align-items:center; }
.phrase-card .txt{ flex:1; }
.phrase-card .en{ font-weight:700; font-family:var(--font-display); font-size:15.5px; }
.phrase-card .ru{ font-size:13px; color:var(--ink-soft); }
.phrase-card .note{ font-size:11.5px; color:var(--amber-600); margin-top:2px; }

/* ---------- achievements ---------- */
.medal{
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 12px; text-align:center;
  border-radius:var(--radius-m); border:1px solid var(--line); background:var(--bg-elevated);
  opacity:.4; filter:grayscale(1);
}
.medal.unlocked{ opacity:1; filter:none; box-shadow:var(--shadow-sm); border-color:var(--amber-500); }
.medal .ic{ width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--amber-500),var(--coral-500)); display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; }
.medal .t{ font-weight:700; font-size:13px; }
.medal .d{ font-size:11.5px; color:var(--ink-soft); }
.xp-bar-wrap{ display:flex; align-items:center; gap:14px; }
.level-badge{
  width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,var(--green-600),var(--green-700));
  color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700; flex-shrink:0;
}

/* ---------- calendar heatmap ---------- */
.heatmap{ display:grid; grid-template-columns:repeat(14,1fr); gap:5px; }
.heat-cell{ aspect-ratio:1; border-radius:4px; background:var(--bg-sunken); }
.heat-cell[data-lvl="1"]{ background:var(--green-100); }
.heat-cell[data-lvl="2"]{ background:var(--green-500); opacity:.6; }
.heat-cell[data-lvl="3"]{ background:var(--green-600); }
.heat-cell[data-lvl="4"]{ background:var(--green-700); }

/* ---------- settings ---------- */
.setting-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line); gap:16px; }
.setting-row:last-child{ border-bottom:none; }
.setting-row .t{ font-weight:600; font-size:14.5px; }
.setting-row .d{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.switch{ position:relative; width:46px; height:26px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--bg-sunken); border:1px solid var(--line); border-radius:99px; cursor:pointer; transition:.2s; }
.switch .track::before{ content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s var(--ease); box-shadow:var(--shadow-sm); }
.switch input:checked + .track{ background:var(--green-600); border-color:var(--green-600); }
.switch input:checked + .track::before{ transform:translateX(20px); }
.seg{ display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; }
.seg button{ border:none; background:none; padding:8px 14px; font-size:13px; cursor:pointer; color:var(--ink-soft); }
.seg button.active{ background:var(--green-600); color:#fff; }
#lang-switch button{ flex:1; font-weight:700; padding:9px 10px; }
.lang-fab{
  position:fixed; top:16px; right:16px; z-index:150;
  background:var(--bg-elevated); box-shadow:var(--shadow-lg); border-radius:99px;
}
.lang-fab button{ font-weight:700; }
@media (max-width:880px){ .lang-fab{ top:auto; bottom:16px; right:16px; } }

/* ---------- toast ---------- */
#toast-host{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.toast{
  background:var(--green-700); color:#fff; padding:13px 18px; border-radius:var(--radius-s); box-shadow:var(--shadow-lg);
  font-size:13.5px; display:flex; align-items:center; gap:10px; animation:toastin .35s var(--ease); max-width:320px;
}
.toast.warn{ background:var(--coral-500); }
.toast.info{ background:var(--ink); }
@keyframes toastin{ from{ opacity:0; transform:translateY(10px) scale(.95);} to{ opacity:1; transform:none; } }

/* ---------- misc ---------- */
.empty{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
.empty .ic{ font-size:34px; margin-bottom:10px; }
.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; margin:26px 0 12px; }
.section-title:first-child{ margin-top:0; }
.two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
@media (max-width:900px){ .two-col{ grid-template-columns:1fr; } }
.hidden{ display:none !important; }

@media (max-width:880px){
  .sidebar{ display:none; }
  .sidebar.open{
    display:flex; position:fixed; z-index:100; height:100vh; box-shadow:var(--shadow-lg); animation:slidein .25s var(--ease);
  }
  @keyframes slidein{ from{ transform:translateX(-100%);} to{ transform:none; } }
  .topbar{ display:flex; }
  .view{ padding:20px 16px 80px; }
  .grid-2,.grid-3{ grid-template-columns:1fr 1fr; }
  .view-head h2{ font-size:24px; }
  #scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; }

/* ---------- состояние приложения ---------- */
const DEFAULT_STATE = {
  learned:[], favorites:[], mistakes:{},
  xp:0, streak:0, lastActiveDate:null, activityLog:{},
  testsDone:0, perfectTests:0, grammarViewed:[], unlocked:[],
  theme:'light', fontScale:1, dailyGoal:10, learnLang:'en',
  chatHistory:{en:[], kk:[]},
};
let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem('engup_state');
    if(raw) return {...DEFAULT_STATE, ...JSON.parse(raw)};
  }catch(e){}
  return {...DEFAULT_STATE};
}
function saveState(){
  localStorage.setItem('engup_state', JSON.stringify(STATE));
}
function levelFromXp(xp){
  const level = Math.floor(xp/150)+1;
  const cur = xp - (level-1)*150;
  return {level, cur, need:150};
}
function addXp(n){
  STATE.xp += n; saveState(); checkAchievements();
}
function touchActivity(){
  const key = todayKey();
  const y = todayKey(new Date(Date.now()-86400000));
  if(STATE.lastActiveDate !== key){
    STATE.streak = (STATE.lastActiveDate === y) ? STATE.streak+1 : 1;
    STATE.lastActiveDate = key;
  }
  STATE.activityLog[key] = (STATE.activityLog[key]||0)+1;
  saveState();
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.unlocked.includes(a.id) && a.check(STATE)){
      STATE.unlocked.push(a.id);
      toast(`Достижение открыто: ${a.t} ${a.ic}`, 'ok', '🏅');
    }
  });
  saveState();
}
function wordKey(w){ return typeof w === 'string' ? w : w.e; }
function isLearned(w){ return STATE.learned.includes(wordKey(w)); }
function isFav(w){ return STATE.favorites.includes(wordKey(w)); }
function toggleLearned(w){
  const k = wordKey(w);
  const i = STATE.learned.indexOf(k);
  if(i>=0){ STATE.learned.splice(i,1); } else { STATE.learned.push(k); addXp(5); touchActivity(); toast('Слово выучено! +5 XP'); }
  saveState(); checkAchievements();
}
function toggleFav(w){
  const k = wordKey(w);
  const i = STATE.favorites.indexOf(k);
  if(i>=0) STATE.favorites.splice(i,1); else STATE.favorites.push(k);
  saveState(); checkAchievements();
}
function recordMistake(w){
  const k = wordKey(w);
  STATE.mistakes[k] = (STATE.mistakes[k]||0)+1;
  saveState();
}
function getWeakWords(){
  return activeVocab().filter(w=>STATE.mistakes[wordKey(w)]>0)
    .sort((a,b)=>(STATE.mistakes[wordKey(b)]||0)-(STATE.mistakes[wordKey(a)]||0));
}

/* ---------- переключение языка обучения ---------- */
const LANGS = {
  en: {label:'English', short:'EN', sub:'Разговорный английский'},
  kk: {label:'Қазақша', short:'ҚАЗ', sub:'Қазақ тілі — разговорный казахский'},
};
function activeVocab(){ return STATE.learnLang === 'kk' ? VOCAB_KK : VOCAB_EN; }
function activeGrammar(){ return STATE.learnLang === 'kk' ? GRAMMAR_KK : GRAMMAR_EN; }
function activePhrases(){ return STATE.learnLang === 'kk' ? PHRASES_KK : PHRASES_EN; }
function activeDialogues(){ return STATE.learnLang === 'kk' ? DIALOGUES_KK : DIALOGUES_EN; }
function setLearnLang(lang){
  if(STATE.learnLang === lang) return;
  STATE.learnLang = lang;
  saveState();
  renderLangSwitch();
  try{ navigate(CURRENT_VIEW); }catch(e){ console.error('navigate failed after language switch:', e); navigate('home'); }
  toast(`Язык обучения переключён на: ${LANGS[lang].label}`);
}
function renderLangSwitch(){
  try{
    const html = Object.keys(LANGS).map(k=>
      `<button class="${STATE.learnLang===k?'active':''}" onclick="setLearnLang('${k}')">${LANGS[k].short}</button>`
    ).join('');
    const host = $('#lang-switch'); if(host) host.innerHTML = html;
    const hostM = $('#lang-switch-mobile'); if(hostM) hostM.innerHTML = html;
    const hostF = $('#lang-fab'); if(hostF) hostF.innerHTML = html;
    const sub = $('#brand-sub'); if(sub) sub.textContent = LANGS[STATE.learnLang].sub;
  }catch(e){ console.error('renderLangSwitch failed:', e); }
}

const NAV = [

  {id:'words', ic:'📖', label:'Изучение слов'},
  {id:'flash', ic:'🔄', label:'Карточки'},

  {id:'speaking', ic:'🗣️', label:'Разговорная практика'},
  {id:'chat', ic:'💬', label:'Чат с ИИ'},
  {id:'achievements', ic:'🏅', label:'Достижения'},
  {id:'settings', ic:'⚙️', label:'Настройки'},
];
let CURRENT_VIEW = 'home';

function renderNav(){
  const nav = $('#nav');
  nav.innerHTML = NAV.map(n=>`
    <button class="nav-item ${CURRENT_VIEW===n.id?'active':''}" onclick="navigate('${n.id}')">
      <span class="ic">${n.ic}</span><span>${n.label}</span>
    </button>`).join('');
  $('#streak-count').textContent = STATE.streak;
}

function navigate(view){
  CURRENT_VIEW = view;
  closeSidebar();
  renderNav();
  const renderers = {
    home: renderHome, words: renderWords, flash: renderFlash, tests: renderTestsHome,
    practice: renderPractice, grammar: renderGrammar, speaking: renderSpeaking, chat: renderChat,
    achievements: renderAchievements, settings: renderSettings,
  };
  window.scrollTo(0,0);
  (renderers[view] || renderHome)();
}

let flashState = { deck:[], idx:0, flipped:false, onlyFav:false, onlyWeak:false, cat:'all' };
function buildFlashDeck(){
  let list = activeVocab();
  if(flashState.cat!=='all') list = list.filter(w=>w.c===flashState.cat);
  if(flashState.onlyFav) list = list.filter(isFav);
  if(flashState.onlyWeak) list = getWeakWords().filter(w=> flashState.cat==='all' || w.c===flashState.cat);
  flashState.deck = shuffle(list.length?list:activeVocab());
  flashState.idx = 0; flashState.flipped = false;
}
function renderFlash(){
  buildFlashDeck();
  $('#view').innerHTML = `
    <div class="view-head">
      <div class="eyebrow">Тренировка памяти</div>
      <h2>Карточки</h2>
      <p>Переворачивайте карточки, отмечайте сложные слова, повторяйте в случайном порядке.</p>
    </div>
    <div class="chip-row">
      <span class="chip ${flashState.cat==='all'?'active':''}" data-fc="all">📋 Все</span>
      ${CATEGORIES.map(c=>`<span class="chip ${flashState.cat===c.id?'active':''}" data-fc="${c.id}">${c.ic} ${c.name}</span>`).join('')}
    </div>
    <div class="chip-row">
      <span class="chip ${flashState.onlyFav?'active':''}" id="fc-fav">⭐ Только избранное</span>
      <span class="chip ${flashState.onlyWeak?'active':''}" id="fc-weak">🧠 Только сложные</span>
      <span class="chip" id="fc-shuffle">🔀 Перемешать</span>
    </div>
    <div class="flash-wrap" id="flash-host"></div>
  `;
  $$('[data-fc]').forEach(ch=> ch.onclick=()=>{ flashState.cat = ch.dataset.fc; renderFlash(); });
  $('#fc-fav').onclick = ()=>{ flashState.onlyFav = !flashState.onlyFav; renderFlash(); };
  $('#fc-weak').onclick = ()=>{ flashState.onlyWeak = !flashState.onlyWeak; renderFlash(); };
  $('#fc-shuffle').onclick = ()=>{ flashState.deck = shuffle(flashState.deck); flashState.idx=0; flashState.flipped=false; renderFlashCard(); };
  renderFlashCard();
}
function renderFlashCard(){
  const host = $('#flash-host');
  if(!flashState.deck.length){ host.innerHTML = `<div class="empty"><div class="ic">🃏</div>Нет карточек по этому фильтру</div>`; return; }
  const w = flashState.deck[flashState.idx];
  host.innerHTML = `
    <div class="flash-scene">
      <div class="flash-card ${flashState.flipped?'flipped':''}" id="fc-card">
        <div class="flash-face flash-front">
          <div class="en">${w.e}</div>
          <div class="tr">${w.t}</div>
          <div class="flash-hint">Нажмите, чтобы перевернуть</div>
        </div>
        <div class="flash-face flash-back">
          <div class="ru">${w.r}</div>
          <div class="tr">${w.t}</div>
          <div class="ex">"${w.x}"<br>${w.xr}</div>
        </div>
      </div>
    </div>
    <div style="font-size:13px;color:var(--ink-faint);">${flashState.idx+1} / ${flashState.deck.length}</div>
    <div class="flash-controls">
      <button class="icon-mini" onclick="speak(${JSON.stringify(w.e)})" title="Прослушать">🔊</button>
      <button class="icon-mini ${isFav(w)?'on':''}" onclick="toggleFav(${JSON.stringify(w.e)});renderFlashCard();" title="Избранное">⭐</button>
      <button class="icon-mini ${isLearned(w)?'learned':''}" onclick="toggleLearned(${JSON.stringify(w.e)});renderFlashCard();" title="Выучено">✔</button>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" onclick="flashPrev()">← Назад</button>
      <button class="btn btn-primary" onclick="flashNext()">Далее →</button>
    </div>
  `;
  $('#fc-card').onclick = (e)=>{ if(e.target.closest('.icon-mini')) return; flashState.flipped = !flashState.flipped; renderFlashCard(); };
}
function flashNext(){ flashState.idx = (flashState.idx+1) % flashState.deck.length; flashState.flipped=false; renderFlashCard(); }
function flashPrev(){ flashState.idx = (flashState.idx-1+flashState.deck.length) % flashState.deck.length; flashState.flipped=false; renderFlashCard(); }

let testState = null;
function renderTestsHome(){
  $('#view').innerHTML = `
    <div class="view-head">
      <div class="eyebrow">Проверка знаний</div>
      <h2>Тесты</h2>

      ].map(m=>`

      `).join('')}

function startTest(type){
  const pool = shuffle(activeVocab()).slice(0, Math.min(10, activeVocab().length));
  testState = { type, pool, idx:0, correct:0, wrong:0, finished:false, answered:false };
  renderTestQuestion();
}
function renderTestQuestion(){
  const s = testState;
  if(s.idx >= s.pool.length){ return renderTestResult(); }
  const w = s.pool[s.idx];
  s.answered = false;
  let body = '';
  if(s.type === 'mcq' || s.type === 'listening'){
    const wrongs = shuffle(activeVocab().filter(x=>x.e!==w.e)).slice(0,3).map(x=>x.r);
    const opts = shuffle([w.r, ...wrongs]);
    body = `
      <div class="test-q">
        <div class="prompt-label">${s.type==='listening'?'Прослушайте и выберите перевод':'Выберите перевод'}</div>
        <div class="prompt">
          ${s.type==='listening' ? `<button class="btn btn-amber" onclick="speak(${JSON.stringify(w.e)})" style="margin-bottom:6px;">🔊 Прослушать</button>` : `${w.e}<span class="tr">${w.t}</span>`}
        </div>
      </div>
      <div class="opt-grid" id="opt-grid">
        ${opts.map(o=>`<button class="opt-btn" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
      </div>
    `;
  } else if(s.type === 'typing'){
    body = `
      <div class="test-q">
        <div class="prompt-label">Напишите слово по-английски</div>
        <div class="prompt">${w.r}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
        <input type="text" class="input-answer" id="typing-input" autocomplete="off" placeholder="type here...">
        <button class="btn btn-primary" id="typing-submit">Проверить</button>
      </div>
    `;
  } else if(s.type === 'gapfill'){
    const gapped = w.x.replace(new RegExp(w.e.split(' ')[0],'i'), '_____');
    body = `
      <div class="test-q">
        <div class="prompt-label">Заполните пропуск</div>
        <div class="prompt" style="font-size:19px;">${gapped}</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:10px;">${w.xr}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
        <input type="text" class="input-answer" id="typing-input" autocomplete="off" placeholder="type here...">
        <button class="btn btn-primary" id="typing-submit">Проверить</button>
      </div>
    `;
  }
  $('#view').innerHTML = `
    <div class="test-progress">
      <span>${s.idx+1} / ${s.pool.length}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${(s.idx/s.pool.length)*100}%"></div></div>
      <span>✅ ${s.correct} ❌ ${s.wrong}</span>
    </div>
    <div class="card">${body}</div>
  `;
  if(s.type==='mcq' || s.type==='listening'){
    $$('#opt-grid .opt-btn').forEach(btn=> btn.onclick = ()=> submitAnswer(btn.dataset.val, w, btn));
    if(s.type==='listening') setTimeout(()=>speak(w.e), 300);
  } else {
    const submit = ()=> submitAnswer($('#typing-input').value.trim(), w, null);
    $('#typing-submit').onclick = submit;
    $('#typing-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    $('#typing-input').focus();
  }
}
function submitAnswer(val, w, btnEl){
  const s = testState;
  if(s.answered) return;
  s.answered = true;
  let isCorrect;
  if(s.type==='mcq' || s.type==='listening'){
    isCorrect = val === w.r;
    $$('#opt-grid .opt-btn').forEach(b=>{
      b.disabled = true;
      if(b.dataset.val === w.r) b.classList.add('correct');
      else if(b===btnEl) b.classList.add('wrong');
    });
  } else {
    const target = w.e.split(' ')[0].toLowerCase();
    isCorrect = val.toLowerCase() === w.e.toLowerCase() || val.toLowerCase() === target;
    const input = $('#typing-input'); if(input) input.disabled = true;
    if(!isCorrect) toast(`Правильный ответ: ${w.e}`, 'warn');
  }
  if(isCorrect){ s.correct++; addXp(3); } else { s.wrong++; recordMistake(w); }
  setTimeout(()=>{ s.idx++; renderTestQuestion(); }, isCorrect ? 700 : 1400);
}
function renderTestResult(){
  const s = testState;
  STATE.testsDone++;
  if(s.wrong===0) STATE.perfectTests++;
  saveState(); touchActivity(); checkAchievements();
  const pct = Math.round((s.correct/s.pool.length)*100);
  $('#view').innerHTML = `
    <div class="card result-hero">
      <div style="font-size:40px;">${pct>=80?'🎉':pct>=50?'👍':'💪'}</div>
      <div class="num">${pct}%</div>
      <p style="color:var(--ink-soft);margin:8px 0 20px;">Правильно: ${s.correct} из ${s.pool.length}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="startTest('${s.type}')">Пройти ещё раз</button>
        <button class="btn btn-ghost" onclick="navigate('tests')">К списку тестов</button>
      </div>
    </div>
  `;
}

    <div class="view-head">
      <div class="eyebrow">Теория и практика</div>
      <h2>Грамматика</h2>
      <p>${activeGrammar().length} ключевых тем с объяснением, примерами и упражнениями.</p>
    </div>
    <div class="gram-list" id="gram-list"></div>
  `;
  const host = $('#gram-list');
  host.innerHTML = activeGrammar().map(g=>`
    <details class="gram-item" data-id="${g.id}">
      <summary>${g.title} <span class="badge-level" style="margin-left:8px;">${g.level}</span></summary>
      <div class="gram-body">
        <p>${g.explain}</p>
        <h5>Примеры</h5>
        ${g.examples.map(ex=>`<div class="example-line">${ex}</div>`).join('')}
        <h5>Упражнение</h5>
        <div id="gex-${g.id}"></div>
        <button class="btn btn-ghost btn-sm gram-ex-btn" data-check="${g.id}">Проверить ответы</button>
      </div>
    </details>
  `).join('');
  activeGrammar().forEach(g=>{
    const exHost = $(`#gex-${g.id}`);
    exHost.innerHTML = g.ex.map((item,i)=>`
      <div style="margin-bottom:8px;">
        <label style="font-size:13.5px;display:block;margin-bottom:4px;">${item.q}</label>
        <input type="text" class="grammar-input" data-gid="${g.id}" data-i="${i}" placeholder="ваш ответ">
        <span class="gram-feedback" data-gid="${g.id}" data-i="${i}" style="font-size:12px;margin-left:6px;"></span>
      </div>
    `).join('');
  });
  $$('.gram-ex-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const gid = btn.dataset.check;
      const g = activeGrammar().find(x=>x.id===gid);
      let allCorrect = true;
      g.ex.forEach((item,i)=>{
        const input = $(`.grammar-input[data-gid="${gid}"][data-i="${i}"]`);
        const fb = $(`.gram-feedback[data-gid="${gid}"][data-i="${i}"]`);
        const val = (input.value||'').trim().toLowerCase().replace(/'/g,"'");
        const ok = item.a.toLowerCase().split(' / ').some(v=>v===val) || val===item.a.toLowerCase();
        fb.textContent = ok ? '✅' : `❌ (${item.a})`;
        fb.style.color = ok ? 'var(--green-600)' : 'var(--coral-500)';
        if(!ok) allCorrect = false;
      });
      if(!STATE.grammarViewed.includes(gid)){ STATE.grammarViewed.push(gid); saveState(); checkAchievements(); }
      if(allCorrect){ addXp(8); toast('Всё верно! +8 XP'); }
    };
  });
  $$('#gram-list details').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      if(d.open && !STATE.grammarViewed.includes(d.dataset.id)){
        STATE.grammarViewed.push(d.dataset.id); saveState(); checkAchievements();
      }
    });
  });
}

/* ============================================================
   НАСТРОЙКИ

function renderSettings(){
  $('#view').innerHTML = `
    <div class="view-head">
      <div class="eyebrow">Персонализация</div>
      <h2>Настройки</h2>
    </div>
    <div class="card">
      <div class="setting-row">
        <div><div class="t">Тёмная тема</div><div class="d">Переключение между светлой и тёмной темой</div></div>
        <label class="switch"><input type="checkbox" id="set-theme" ${STATE.theme==='dark'?'checked':''}><span class="track"></span></label>
      </div>
      <div class="setting-row">
        <div><div class="t">Размер шрифта</div><div class="d">Настройте комфортный размер текста</div></div>
        <div class="seg" id="font-seg">
          <button data-v="0.9" class="${STATE.fontScale==0.9?'active':''}">A-</button>
          <button data-v="1" class="${STATE.fontScale==1?'active':''}">A</button>
          <button data-v="1.15" class="${STATE.fontScale==1.15?'active':''}">A+</button>
        </div>
      </div>
      <div class="setting-row">
        <div><div class="t">Дневная цель</div><div class="d">Количество действий в день для поддержания серии</div></div>
        <div class="seg" id="goal-seg">
          ${[5,10,20].map(n=>`<button data-v="${n}" class="${STATE.dailyGoal==n?'active':''}">${n}</button>`).join('')}
        </div>
      </div>
      <div class="setting-row">
        <div><div class="t">Экспорт прогресса</div><div class="d">Сохранить прогресс в JSON-файл</div></div>
        <button class="btn btn-ghost btn-sm" onclick="exportProgress()">Экспорт</button>
      </div>
      <div class="setting-row">
        <div><div class="t">Импорт прогресса</div><div class="d">Загрузить ранее сохранённый JSON</div></div>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">Импорт<input type="file" id="import-file" accept=".json" style="display:none;"></label>
      </div>
      <div class="setting-row">
        <div><div class="t">Очистить весь прогресс</div><div class="d">Это действие необратимо</div></div>
        <button class="btn btn-danger btn-sm" onclick="clearProgress()">Очистить</button>
      </div>
    </div>
  `;
  $('#set-theme').onchange = (e)=>{ STATE.theme = e.target.checked ? 'dark' : 'light'; applyTheme(); saveState(); };
  $$('#font-seg button').forEach(b=> b.onclick = ()=>{ STATE.fontScale = parseFloat(b.dataset.v); applyFontScale(); saveState(); renderSettings(); });
  $$('#goal-seg button').forEach(b=> b.onclick = ()=>{ STATE.dailyGoal = parseInt(b.dataset.v); saveState(); renderSettings(); toast('Дневная цель обновлена'); });
  $('#import-file').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        STATE = {...DEFAULT_STATE, ...data};
        saveState(); applyTheme(); applyFontScale();
        toast('Прогресс успешно импортирован!');
        navigate('home');
      }catch(err){ toast('Ошибка при чтении файла', 'warn'); }
    };
    reader.readAsText(file);
  };
}
function exportProgress(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `engup-progress-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Прогресс экспортирован');
}
function clearProgress(){
  if(!confirm('Точно очистить весь прогресс? Это действие нельзя отменить.')) return;
  STATE = {...DEFAULT_STATE};
  saveState(); applyTheme(); applyFontScale();
  toast('Прогресс очищен', 'info');
  navigate('home');
}


/* ============================================================
   ЧАТ С ИИ-РЕПЕТИТОРОМ (живое общение на изучаемом языке)
   ============================================================ */
const CHAT_STARTERS = {
  en: [
    "Let's talk about my day",
    "Teach me some slang for greetings",
    "Help me order food at a restaurant",
    "Correct my English, please: I go to store yesterday",
  ],
  kk: [
    "Менің күнім туралы сөйлесейік",
    "Сәлемдесудің бірнеше сөзін үйрет",
    "Мейрамханада тамақ тапсыруға көмектес",
    "Мына сөйлемді түзетші: Мен кеше дүкенге барамын",
  ],
};
let chatBusy = false;

function getChatHistory(){
  if(!STATE.chatHistory) STATE.chatHistory = {en:[], kk:[]};
  if(!STATE.chatHistory[STATE.learnLang]) STATE.chatHistory[STATE.learnLang] = [];
  return STATE.chatHistory[STATE.learnLang];
}

function chatSystemPrompt(){
  if(STATE.learnLang === 'kk'){
    return "You are 'EngUp Tutor', a warm and encouraging Kazakh language conversation partner inside a self-study app. The learner's native language is Russian and their level is beginner to intermediate. Reply mostly in Kazakh, using short, natural, everyday sentences. If the learner makes a grammar or word-choice mistake, gently include a corrected version and a one-line explanation in Russian, formatted on a new line starting with '💡'. Keep replies under 90 words. End with a natural follow-up question in Kazakh to keep the conversation going. Do not switch fully into Russian or English unless the learner explicitly asks for a translation.";
  }
  return "You are 'EngUp Tutor', a warm and encouraging American English conversation partner inside a self-study app focused on everyday conversational English, including common slang. The learner's native language is Russian and their level is beginner to intermediate. Reply mostly in English, using short, natural, casual sentences, and feel free to use common American conversational expressions. If the learner makes a grammar or word-choice mistake, gently include a corrected version and a one-line explanation in Russian, formatted on a new line starting with '💡'. Keep replies under 90 words. End with a natural follow-up question in English to keep the conversation going. Do not switch fully into Russian unless the learner explicitly asks for a translation.";
}

function renderChat(){
  const history = getChatHistory();
  $('#view').innerHTML = `
    <div class="view-head">
      <div class="eyebrow">Живое общение</div>
      <h2>Чат с ИИ-репетитором</h2>
      <p>Общайтесь свободно на ${STATE.learnLang==='kk'?'казахском':'английском'} языке — ИИ мягко поправит ошибки и продолжит разговор.</p>
    </div>
    <div class="card">
      <div class="chip-row" id="chat-starters" style="margin-bottom:14px;"></div>
      <div class="chat-shell">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar">
          <button class="icon-btn mic-btn" id="chat-mic" title="Голосовой ввод">🎤</button>
          <textarea id="chat-input" rows="1" placeholder="${STATE.learnLang==='kk' ? 'Хабарламаңызды жазыңыз...' : 'Type your message...'}"></textarea>
          <button class="send-btn" id="chat-send" title="Отправить">➤</button>
        </div>
      </div>
    </div>
    <div style="margin-top:10px;text-align:right;">
      <button class="btn btn-ghost btn-sm" onclick="clearChat()">🗑 Очистить чат</button>
    </div>
  `;
  $('#chat-starters').innerHTML = CHAT_STARTERS[STATE.learnLang].map(s=>
    `<span class="chip" data-starter="${s.replace(/"/g,'&quot;')}">${s}</span>`
  ).join('');
  $$('#chat-starters .chip').forEach(ch=> ch.onclick = ()=>{ sendChatMessage(ch.dataset.starter); });

  renderChatMessages();

  const input = $('#chat-input');
  const autoresize = ()=>{ input.style.height='auto'; input.style.height = Math.min(120, input.scrollHeight)+'px'; };
  input.addEventListener('input', autoresize);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); trySend(); }
  });
  $('#chat-send').onclick = trySend;
  function trySend(){
    const val = input.value.trim();
    if(!val || chatBusy) return;
    input.value=''; autoresize();
    sendChatMessage(val);
  }

  setupChatMic();
}

function renderChatMessages(){
  const host = $('#chat-messages');
  if(!host) return;
  const history = getChatHistory();
  if(!history.length){
    host.innerHTML = `<div class="chat-empty"><div class="ic">💬</div>Начните разговор — напишите сообщение или выберите тему выше.</div>`;
  } else {
    host.innerHTML = history.map(m=>`
      <div class="chat-bubble-row ${m.role==='user'?'user':''}">
        <div class="chat-avatar">${m.role==='user'?'🙂':'🤖'}</div>
        <div>
          <div class="chat-bubble">${formatChatText(m.text)}</div>
          ${m.role==='assistant' ? `<div class="chat-bubble-actions"><button class="icon-mini" onclick="speak(${JSON.stringify(stripNote(m.text))})">🔊</button></div>` : ''}
        </div>
      </div>
    `).join('');
  }
  host.scrollTop = host.scrollHeight;
}
function stripNote(text){ return text.split('💡')[0].trim(); }
function formatChatText(text){
  const parts = text.split('💡');
  let html = escapeHtml(parts[0]).replace(/\n/g,'<br>');
  if(parts[1]){ html += `<div class="note">💡${escapeHtml(parts[1])}</div>`; }
  return html;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendChatMessage(text){
  if(chatBusy) return;
  chatBusy = true;
  const history = getChatHistory();
  history.push({role:'user', text});
  if(history.length>40) history.splice(0, history.length-40);
  saveState();
  renderChatMessages();
  showTypingIndicator();

  try{
    const apiMessages = history.slice(-16).map(m=>({role: m.role, content: m.text}));
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: chatSystemPrompt(),
        messages: apiMessages,
      }),
    });
    const data = await response.json();
    let replyText = "";
    if(data && data.content){
      replyText = data.content.map(b=> b.type==='text' ? b.text : '').filter(Boolean).join('\n');
    }
    if(!replyText){ replyText = STATE.learnLang==='kk' ? "Кешіріңіз, жауап ала алмадым, қайталап көріңізші." : "Sorry, I couldn't get a reply — please try again."; }
    history.push({role:'assistant', text:replyText});
    if(history.length>40) history.splice(0, history.length-40);
    addXp(2); touchActivity();
    saveState(); checkAchievements();
  }catch(err){
    toast('Не удалось связаться с ИИ. Проверьте соединение.', 'warn');
  }finally{
    hideTypingIndicator();
    chatBusy = false;
    renderChatMessages();
  }
}

function showTypingIndicator(){
  const host = $('#chat-messages'); if(!host) return;
  const row = document.createElement('div');
  row.className = 'typing-row'; row.id = 'typing-indicator';
  row.innerHTML = `<div class="chat-avatar">🤖</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  host.appendChild(row);
  host.scrollTop = host.scrollHeight;
}
function hideTypingIndicator(){
  const el = $('#typing-indicator'); if(el) el.remove();
}
function clearChat(){
  if(!confirm('Очистить историю чата для этого языка?')) return;
  getChatHistory().length = 0;
  saveState();
  renderChatMessages();
}

/* ---------- голосовой ввод (Web Speech API, если доступен) ---------- */
let recognizer = null, recognizing = false;
function setupChatMic(){
  const btn = $('#chat-mic');
  if(!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ btn.style.display = 'none'; return; }
  btn.onclick = ()=>{
    if(recognizing){ recognizer && recognizer.stop(); return; }
    recognizer = new SR();
    recognizer.lang = STATE.learnLang==='kk' ? 'kk-KZ' : 'en-US';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onstart = ()=>{ recognizing = true; btn.classList.add('recording'); };
    recognizer.onend = ()=>{ recognizing = false; btn.classList.remove('recording'); };
    recognizer.onerror = ()=>{ recognizing = false; btn.classList.remove('recording'); toast('Не удалось распознать речь', 'warn'); };
    recognizer.onresult = (e)=>{
      const text = e.results[0][0].transcript;
      const input = $('#chat-input');
      if(input){ input.value = (input.value ? input.value+' ' : '') + text; input.dispatchEvent(new Event('input')); }
    };
    recognizer.start();
  };
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init(){
  try{ applyTheme(); }catch(e){ console.error('applyTheme failed:', e); }
  try{ applyFontScale(); }catch(e){ console.error('applyFontScale failed:', e); }
  try{ renderLangSwitch(); }catch(e){ console.error('renderLangSwitch failed:', e); }
  try{ renderNav(); }catch(e){ console.error('renderNav failed:', e); }
  try{ navigate('home'); }catch(e){ console.error('navigate failed:', e); }
}
document.addEventListener('DOMContentLoaded', init);
</script>
